apiVersion: v1
kind: ConfigMap
metadata:
  name: xray-routing-panel-config
data:
  PANEL_PUBLIC_URL: "http://your-node-or-domain:18080"
  PANEL_SUBSCRIPTION_PUBLIC_URL: "https://sub.xray.zrhe2016.cc"
  PANEL_LOG_LEVEL: "INFO"
  PANEL_SLOW_REQUEST_MS: "1000"
  DEFAULT_UPSTREAM_HOST: "127.0.0.1"
  DEFAULT_UPSTREAM_PORT: "443"
  SEED_LISTEN_PORT: "31098"
  PROBE_ENABLED: "1"
  PROBE_INTERVAL: "180"
  PROBE_TEST_LISTEN_PORT: "31098"
  DNS_FAILOVER_PEAK_ENABLED: "0"
  DNS_FAILOVER_PEAK_START: "19:00"
  DNS_FAILOVER_PEAK_END: "23:00"
  DNS_FAILOVER_PEAK_TIMEZONE: ""
  AI_DOMAIN_INTERVAL_SECONDS: "3600"
  AI_DOMAIN_LOOKBACK_SECONDS: "3600"
  AI_DOMAIN_BATCH_SIZE: "50"
  PANEL_ROUTE_LISTEN_PORT: "31098"
  # The xray-reloader sidecar watches the shared runtime config and restarts
  # Xray; the AI manager itself has no direct data-plane restart command.
  DATAPLANE_EXTERNAL_RELOADER_ENABLED: "1"
  # The panel and manager are sibling containers in one Pod; invoke the
  # manager with the panel's Python runtime instead of Docker exec.
  AI_DOMAIN_MANAGER_EXECUTION_MODE: "local"
  CODEX_CLASSIFIER_ENABLED: "0"
  OPENAI_MODEL: "gpt-5.5"
  OPENAI_BASE_URL: "https://api.openai.com/v1/responses"
  OPENAI_ALLOW_NO_KEY: "0"
  DB_BACKUP_KEEP_DAYS: "7"
  DB_BACKUP_PREFIX: "xray-routing-panel"
  DB_BACKUP_BUNDLE_ENABLED: "1"
  DB_BACKUP_BUNDLE_DIR: "/backups"
  DB_BACKUP_BUNDLE_KEEP_DAYS: "7"
  DB_BACKUP_BUNDLE_PREFIX: "xray-routing-panel"
  DB_BACKUP_RECOVERY_REQUIRED: "0"
  DB_BACKUP_RECOVERY_STATUS_PATH: "/backups/node-recovery-status.json"
  DB_BACKUP_EXTRA_PATHS: "/app/xray/runtime,/app/xray/.env,/data/uploads"
  DB_BACKUP_SSH_COLLECTION_ENABLED: "0"
  DB_BACKUP_SSH_COLLECTION_REQUIRED: "0"
