apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-routing-panel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xray-routing-panel
  template:
    metadata:
      labels:
        app: xray-routing-panel
    spec:
      nodeSelector:
        xray-routing-panel/node: "true"
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-shared-storage
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /shared/data /shared/runtime /shared/logs /shared/reports /shared/backups && chmod -R a+rwX /shared/data /shared/runtime /shared/logs /shared/reports /shared/backups
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
        - name: init-bootstrap
          image: ghcr.io/your-org/xray-routing-panel:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - from app.state import PanelState; PanelState().bootstrap()
          envFrom:
            - configMapRef:
                name: xray-routing-panel-config
          env:
            - name: DATA_DIR
              value: /data
            - name: DB_PATH
              value: /data/panel.db
            - name: XRAY_ENV_FILE_PATH
              value: /app/xray/.env
            - name: XRAY_CONFIG_PATH
              value: /app/xray/runtime/config.json
            - name: XRAY_PANEL_PORTS_PATH
              value: /app/xray/runtime/panel-ports.json
            - name: XRAY_ACCESS_LOG_PATH
              value: /app/xray/logs/access.log
            - name: XRAY_API_SERVER
              value: 127.0.0.1:10085
            - name: XRAY_CLIENT_CONFIG_PATH
              value: /app/xray/runtime/client-test.json
            - name: DATAPLANE_LOCAL_BIN
              value: /usr/local/bin/xray
            - name: DATAPLANE_CONTAINER_NAME
              value: ""
            - name: PANEL_HOST
              value: 0.0.0.0
            - name: PANEL_PORT
              value: "18080"
            - name: PANEL_HEALTH_REQUIRES_XRAY
              value: "1"
            - name: PANEL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_USERNAME
            - name: PANEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_PASSWORD
            - name: PANEL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_SECRET_KEY
          volumeMounts:
            - name: shared-storage
              mountPath: /data
              subPath: data
            - name: shared-storage
              mountPath: /app/xray/runtime
              subPath: runtime
            - name: shared-storage
              mountPath: /app/xray/logs
              subPath: logs
            - name: shared-storage
              mountPath: /var/log/xray
              subPath: logs
            - name: xray-env
              mountPath: /app/xray/.env
              subPath: xray.env
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
      containers:
        - name: panel
          image: ghcr.io/your-org/xray-routing-panel:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: xray-routing-panel-config
          env:
            - name: DATA_DIR
              value: /data
            - name: DB_PATH
              value: /data/panel.db
            - name: XRAY_ENV_FILE_PATH
              value: /app/xray/.env
            - name: XRAY_CONFIG_PATH
              value: /app/xray/runtime/config.json
            - name: XRAY_PANEL_PORTS_PATH
              value: /app/xray/runtime/panel-ports.json
            - name: XRAY_ACCESS_LOG_PATH
              value: /app/xray/logs/access.log
            - name: XRAY_API_SERVER
              value: 127.0.0.1:10085
            - name: XRAY_CLIENT_CONFIG_PATH
              value: /app/xray/runtime/client-test.json
            - name: DATAPLANE_LOCAL_BIN
              value: /usr/local/bin/xray
            - name: DATAPLANE_CONTAINER_NAME
              value: ""
            - name: PANEL_HOST
              value: 0.0.0.0
            - name: PANEL_PORT
              value: "18080"
            - name: PANEL_HEALTH_REQUIRES_XRAY
              value: "1"
            - name: PANEL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_USERNAME
            - name: PANEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_PASSWORD
            - name: PANEL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_SECRET_KEY
          ports:
            - containerPort: 18080
              name: panel
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared-storage
              mountPath: /data
              subPath: data
            - name: shared-storage
              mountPath: /panel-data
              subPath: data
            - name: shared-storage
              mountPath: /app/xray/runtime
              subPath: runtime
            - name: shared-storage
              mountPath: /app/xray/logs
              subPath: logs
            - name: shared-storage
              mountPath: /var/log/xray
              subPath: logs
            - name: shared-storage
              mountPath: /app/xray/reports
              subPath: reports
            - name: xray-env
              mountPath: /app/xray/.env
              subPath: xray.env
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
        - name: xray
          image: ghcr.io/xtls/xray-core:26.5.3
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/xray
          args:
            - run
            - -c
            - /etc/xray/config.json
          ports:
            - containerPort: 443
              name: xray-default
              protocol: TCP
          volumeMounts:
            - name: shared-storage
              mountPath: /etc/xray
              subPath: runtime
            - name: shared-storage
              mountPath: /var/log/xray
              subPath: logs
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: xray-reloader
          # Reuse the panel image so the watcher has both the Xray binary for
          # validation and procps' pidof in the shared process namespace.
          image: ghcr.io/your-org/xray-routing-panel:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/watch-xray-config.sh
          env:
            - name: XRAY_CONFIG_PATH
              value: /etc/xray/config.json
            - name: XRAY_POLL_INTERVAL_SECONDS
              value: "2"
            - name: XRAY_VALIDATE_BIN
              value: /usr/local/bin/xray
          volumeMounts:
            - name: shared-storage
              mountPath: /etc/xray
              subPath: runtime
            - name: shared-storage
              mountPath: /var/log/xray
              subPath: logs
            - name: xray-reloader-scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: xray-ai-domain-manager
          image: ghcr.io/your-org/xray-routing-panel-ai-manager:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.xray.ai_domain_manager
          envFrom:
            - configMapRef:
                name: xray-routing-panel-config
          env:
            - name: XRAY_WORKSPACE_DIR
              value: /workspace/app/xray
            - name: XRAY_ACCESS_LOG_PATH
              value: /workspace/app/xray/logs/access.log
            - name: AI_DOMAIN_REPORT_OUTPUT_DIR
              value: /workspace/app/xray/reports/hourly-domains
            - name: XRAY_ENV_FILE
              value: /workspace/app/xray/.env
            - name: XRAY_CONFIG_OUT
              value: /workspace/app/xray/runtime/config.json
            - name: XRAY_CLIENT_OUT
              value: /workspace/app/xray/runtime/client-test.json
            - name: XRAY_SHARE_OUT
              value: /workspace/app/xray/runtime/client-share.txt
            - name: PANEL_DB_PATH
              value: /panel-data/panel.db
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: shared-storage
              mountPath: /workspace/app/xray/runtime
              subPath: runtime
            - name: shared-storage
              mountPath: /workspace/app/xray/logs
              subPath: logs
            - name: shared-storage
              mountPath: /workspace/app/xray/reports
              subPath: reports
            - name: shared-storage
              mountPath: /panel-data
              subPath: data
            - name: xray-env
              mountPath: /workspace/app/xray/.env
              subPath: xray.env
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: xray-routing-panel-shared
        - name: xray-env
          secret:
            secretName: xray-routing-panel-secrets
        - name: xray-reloader-scripts
          configMap:
            name: xray-reloader-scripts
            defaultMode: 0555
