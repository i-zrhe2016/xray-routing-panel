global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: xray-panel
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["127.0.0.1:18080"]
        labels:
          role: control_plane
          host: panel
          node_id: control-01
          node_role: control_plane
          environment: production
          region: unknown

  - job_name: control-plane-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          host: panel
          node_id: control-01
          role: control_plane
          node_role: control_plane
          environment: production
          region: unknown
          provider: digitalocean

  - job_name: data-plane-node
    static_configs:
      # The normal data-plane exporter is reachable from the control plane over the private network.
      - targets: ["100.116.187.106:19100"]
        labels:
          host: normal-data-plane
          node_id: normal-01
          node_role: normal_data_plane
          environment: production
          region: unknown
      - targets: ["100.109.201.64:27168"]
        labels:
          host: ai-hawaii
          node_id: ai-hawaii
          node_role: ai_data_plane
          environment: production
          region: hawaii
          component: node_exporter
      - targets: ["100.87.76.6:9100"]
        labels:
          host: ai-taiwan
          node_id: ai-taiwan
          node_role: ai_data_plane
          environment: production
          region: taiwan
          component: node_exporter

  - job_name: data-plane-cadvisor
    static_configs:
      # Keep cAdvisor on the same private management path as node_exporter.
      - targets: ["100.116.187.106:18081"]
        labels:
          host: normal-data-plane
          node_id: normal-01
          node_role: normal_data_plane
          environment: production
          region: unknown
          xray_container: xray-reality-local
      - targets: ["100.109.201.64:27169"]
        labels:
          host: ai-hawaii
          node_id: ai-hawaii
          node_role: ai_data_plane
          environment: production
          region: hawaii
          xray_container: xray
          component: cadvisor
      - targets: ["100.87.76.6:18081"]
        labels:
          host: ai-taiwan
          node_id: ai-taiwan
          node_role: ai_data_plane
          environment: production
          region: taiwan
          xray_container: xray-ai-node
          component: cadvisor

  - job_name: control-plane-cadvisor
    static_configs:
      - targets: ["127.0.0.1:18081"]
        labels:
          host: panel
          node_id: control-01
          node_role: control_plane
          environment: production
          region: unknown
          component: cadvisor

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
